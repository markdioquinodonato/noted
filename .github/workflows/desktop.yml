name: App build & release

# Builds Noted (Tauri v2) installers on native GitHub-hosted runners:
#   Windows x64 (NSIS .exe + .msi), macOS Apple Silicon (.dmg), macOS Intel (.dmg),
#   Android (signed universal arm64 + armv7 .apk).
#
# • Push a tag "vX.Y.Z" (matching package.json) → build all platforms, then publish a
#   GitHub Release ONLY if every platform succeeded (otherwise it stays a draft).
# • Run manually ("Run workflow") → build all platforms and upload artifacts; tick
#   "release" to publish v<package.json version> the same way.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub Release for v<package.json version> after all platforms build
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release == true }}

jobs:
  validate:
    name: Validate (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($expected)"; exit 1
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: Noted-Windows-x64
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: Noted-macOS-AppleSilicon
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: Noted-macOS-Intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Updater endpoint for this repository
        shell: bash
        run: node scripts/desktop-release-config.mjs

      - name: Check updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Repository secret TAURI_SIGNING_PRIVATE_KEY is missing; updater artifacts cannot be signed."
            exit 1
          fi

      # Apple signing + notarization are used only when the secrets exist.
      # Without them the macOS app is ad-hoc signed (runs, but is NOT notarized).
      - name: Optional Apple signing & notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              [ -n "${!v}" ] && echo "$v=${!v}" >> "$GITHUB_ENV"
            done
            echo "Apple Developer signing enabled."
          else
            echo "::warning::No Apple Developer certificate configured: macOS build is ad-hoc signed and NOT notarized."
          fi

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Public, browser-safe values only (never service-role keys).
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
        with:
          tauriScript: npx tauri
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
          tagName: ${{ env.RELEASE == 'true' && 'v__VERSION__' || '' }}
          releaseName: Noted v__VERSION__
          releaseBody: |
            Noted v__VERSION__ for Android, Windows and macOS.

            • Android: download `Noted-Android.apk` on your phone, open it and tap Install
              (allow "Install unknown apps" for your browser if asked). Android 7.0+.
            • Windows: download the `-setup.exe` (or the `.msi`).
            • macOS: `aarch64.dmg` for Apple Silicon (M1/M2/M3/M4), `x64.dmg` for Intel Macs.

            These builds are not code-signed with a commercial certificate yet: Windows may show a
            SmartScreen notice, and on macOS right-click Noted → Open the first time.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Collect installers
        shell: bash
        run: node scripts/collect-installers.mjs ${{ matrix.target }} installers

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: installers/*
          if-no-files-found: error
          retention-days: 30

  android:
    name: Build (Android APK)
    needs: validate
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The legacy "tools" package (this action's default) no longer exists.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager --install "ndk;${NDK_VERSION}" > /dev/null

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: android

      - run: npm ci

      - name: Check Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::Repository secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD are missing; the APK cannot be signed."
            exit 1
          fi

      # src-tauri/gen is generated, never committed: create the Android project fresh
      # and give it the Noted launcher icons.
      - name: Generate Android project
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          npx tauri android init --ci
          npx tauri icon src-tauri/icons/icon.png
          # Camera (document scanner, photo attachments) and microphone (voice notes):
          # the WebView asks the user at runtime, but Android requires them declared here.
          manifest=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          for perm in CAMERA RECORD_AUDIO MODIFY_AUDIO_SETTINGS; do
            grep -q "android.permission.$perm\"" "$manifest" ||
              sed -i "s#<application#<uses-permission android:name=\"android.permission.$perm\" />\n    <application#" "$manifest"
          done
          grep -n 'uses-permission' "$manifest"

      - name: Build APK (arm64 + armv7)
        env:
          # Public, browser-safe values only (never service-role keys).
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_RELEASES_REPO: ${{ github.repository }}
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          npx tauri android build --apk --target aarch64 --target armv7

      - name: Sign APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: noted
        run: |
          set -euo pipefail
          unsigned=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -n 1)
          if [ -z "$unsigned" ]; then echo "::error::No unsigned release APK was produced."; exit 1; fi
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          keystore="$RUNNER_TEMP/noted-release.p12"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          mkdir -p installers
          "$tools/zipalign" -p -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$keystore" --ks-type PKCS12 --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out installers/Noted-Android.apk "$RUNNER_TEMP/aligned.apk"
          rm -f "$keystore"
          "$tools/apksigner" verify --verbose --print-certs installers/Noted-Android.apk
          ls -lh installers

      - uses: actions/upload-artifact@v4
        with:
          name: Noted-Android
          path: installers/Noted-Android.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish release
    needs: [build, android]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Noted-Android
          path: android
      - name: Attach the Android APK, verify every installer is attached, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          gh release upload "$tag" android/Noted-Android.apk --clobber
          assets=$(gh release view "$tag" --json assets --jq '.assets[] | select(.size > 0) | .name')
          echo "$assets"
          missing=0
          for pattern in '_x64-setup\.exe$' '_x64_.*\.msi$' '_aarch64\.dmg$' '_x64\.dmg$' '^latest\.json$' '^Noted-Android\.apk$'; do
            if ! echo "$assets" | grep -Eq "$pattern"; then
              echo "::error::Release $tag is missing an asset matching $pattern"; missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          gh release edit "$tag" --draft=false --latest
          echo "Published $(gh release view "$tag" --json url --jq .url)"
